<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#070a1c">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Coloniza una isla, comercia y construye con tus amigos desde el móvil.">
  <title>Hexaterra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- PORTADA -->
    <section id="home" class="screen">
      <div class="home-inner">
        <div class="logo">
          <div class="logo-row" aria-hidden="true">
            <span class="tile t1"><svg viewBox="0 0 24 24"><use href="#r-wood"/></svg></span>
            <span class="tile t2"><svg viewBox="0 0 24 24"><use href="#r-brick"/></svg></span>
            <span class="tile t3"><svg viewBox="0 0 24 24"><use href="#r-sheep"/></svg></span>
            <span class="tile t4"><svg viewBox="0 0 24 24"><use href="#r-wheat"/></svg></span>
            <span class="tile t5"><svg viewBox="0 0 24 24"><use href="#r-ore"/></svg></span>
          </div>
          <h1>Hexaterra</h1>
          <p class="tagline">Coloniza la isla, comercia y construye</p>
        </div>
        <div id="resumeBox" class="card-box hidden"></div>
        <div class="card-box">
          <label class="field"><span>Tu nombre</span>
            <input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="Por ejemplo, Lucía">
          </label>
          <div id="joinCodeRow" class="field">
            <span>Código de sala</span>
            <input id="codeInput" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD">
          </div>
          <div class="btn-row">
            <button class="btn primary" data-do="join" id="joinBtn">Unirse</button>
            <button class="btn" data-do="create" id="createBtn">Crear partida</button>
          </div>
          <p id="homeError" class="error"></p>
        </div>
        <button class="link-btn" data-do="sheet" data-sheet="rules">Cómo se juega</button>
      </div>
    </section>

    <!-- SALA DE ESPERA -->
    <section id="lobby" class="screen">
      <div class="lobby-inner">
        <div class="lobby-head">
          <div>
            <div class="muted small">Código de sala</div>
            <div id="lobbyCode" class="room-code">····</div>
          </div>
          <button class="btn small" data-do="share">Compartir enlace</button>
        </div>
        <div class="qr-wrap"><div id="qr"></div><p class="muted small">Tus amigos pueden escanear este código o entrar con el código de sala.</p></div>
        <h3>Jugadores <span id="lobbyCount" class="muted"></span></h3>
        <ul id="lobbyPlayers" class="lobby-players"></ul>
        <h3>Tu color</h3>
        <div id="colorPick" class="color-pick"></div>
        <h3>Reglas de la partida</h3>
        <div id="lobbySettings" class="settings"></div>
        <div class="btn-row">
          <button class="btn" data-do="leaveLobby">Salir</button>
          <button class="btn primary" id="startBtn" data-do="start">Empezar partida</button>
        </div>
        <p id="lobbyHint" class="muted small center"></p>
      </div>
    </section>

    <!-- PARTIDA -->
    <section id="game" class="screen">
      <header id="topbar">
        <div id="players" class="players"></div>
        <button class="icon-btn" data-do="sheet" data-sheet="menu" aria-label="Menú"><svg viewBox="0 0 24 24"><use href="#i-menu"/></svg></button>
      </header>
      <div id="boardWrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg"><g id="world"></g></svg>
        <div class="board-tools">
          <button class="tool-btn" data-do="sheet" data-sheet="log" aria-label="Historial"><svg viewBox="0 0 24 24"><use href="#i-scroll"/></svg></button>
          <button class="tool-btn" data-do="sheet" data-sheet="rules" aria-label="Reglas"><svg viewBox="0 0 24 24"><use href="#i-help"/></svg></button>
          <button class="tool-btn" data-do="center" aria-label="Centrar tablero"><svg viewBox="0 0 24 24"><use href="#i-zoom"/></svg></button>
        </div>
        <div id="dice" class="dice"></div>
        <div id="netState" class="net-state hidden">Sin conexión…</div>
        <div id="tradeBanner" class="trade-banner hidden"></div>
        <div id="confirmBar" class="confirm-bar hidden"></div>
      </div>
      <div id="side">
        <div id="status" class="status"></div>
        <div id="hand" class="hand"></div>
        <nav id="actions" class="actions"></nav>
        <div id="logInline" class="log-inline"></div>
      </div>
    </section>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-do="closeSheet"></div>
    <div class="sheet-panel" role="dialog">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn close" data-do="closeSheet" aria-label="Cerrar">X</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
