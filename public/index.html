<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0c2233">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="Coloniza una isla, comercia y construye con tus amigos desde el móvil.">
  <title>Hexaterra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Iconos (dibujos propios) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="r-wood" viewBox="0 0 24 24">
        <path d="M12 1.5 L18.5 9.5 H15.2 L20 16.5 H4 L8.8 9.5 H5.5 Z" fill="#2f8a3a" stroke="#14451b" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M12 1.5 L15 5.3 H9 Z" fill="#4fb05a"/>
        <rect x="10.4" y="16.5" width="3.2" height="5.5" rx=".6" fill="#7a5233" stroke="#3e2914" stroke-width=".8"/>
      </symbol>
      <symbol id="r-brick" viewBox="0 0 24 24">
        <g stroke="#6e2d14" stroke-width="1" stroke-linejoin="round">
          <rect x="1.8" y="14" width="9.6" height="6.2" rx="1" fill="#c75a30"/>
          <rect x="12.6" y="14" width="9.6" height="6.2" rx="1" fill="#d66a3c"/>
          <rect x="7" y="6.6" width="10" height="6.2" rx="1" fill="#e07a47"/>
        </g>
        <path d="M3 15.5h7M13.8 15.5h7M8.2 8.1h7.6" stroke="#f3a37a" stroke-width=".9" stroke-linecap="round"/>
      </symbol>
      <symbol id="r-sheep" viewBox="0 0 24 24">
        <path d="M7.5 16.5v4.5M11 17v4.5M14.5 17v4.5M17.5 16v4.5" stroke="#2b2b2b" stroke-width="1.7" stroke-linecap="round"/>
        <g fill="#5b5b5b">
          <circle cx="7.6" cy="12" r="4.4"/><circle cx="11.6" cy="9.6" r="4.6"/><circle cx="15.6" cy="11.6" r="4.4"/><circle cx="11" cy="14.4" r="4.4"/><circle cx="15" cy="14.6" r="3.9"/>
        </g>
        <g fill="#fbfaf5">
          <circle cx="7.6" cy="12" r="3.6"/><circle cx="11.6" cy="9.6" r="3.8"/><circle cx="15.6" cy="11.6" r="3.6"/><circle cx="11" cy="14.4" r="3.6"/><circle cx="15" cy="14.6" r="3.1"/>
        </g>
        <ellipse cx="19.6" cy="10.2" rx="2.7" ry="2.1" fill="#2f2f2f"/>
        <circle cx="20.4" cy="9.7" r=".55" fill="#fff"/>
      </symbol>
      <symbol id="r-wheat" viewBox="0 0 24 24">
        <path d="M12 23V5.5" stroke="#8a6512" stroke-width="1.4" stroke-linecap="round"/>
        <g fill="#f0bf35" stroke="#8a6512" stroke-width=".9">
          <ellipse cx="12" cy="3.6" rx="1.7" ry="2.6"/>
          <ellipse cx="9.4" cy="7.6" rx="1.5" ry="2.5" transform="rotate(-32 9.4 7.6)"/>
          <ellipse cx="14.6" cy="7.6" rx="1.5" ry="2.5" transform="rotate(32 14.6 7.6)"/>
          <ellipse cx="9.4" cy="11.6" rx="1.5" ry="2.5" transform="rotate(-32 9.4 11.6)"/>
          <ellipse cx="14.6" cy="11.6" rx="1.5" ry="2.5" transform="rotate(32 14.6 11.6)"/>
          <ellipse cx="9.4" cy="15.6" rx="1.5" ry="2.5" transform="rotate(-32 9.4 15.6)"/>
          <ellipse cx="14.6" cy="15.6" rx="1.5" ry="2.5" transform="rotate(32 14.6 15.6)"/>
        </g>
      </symbol>
      <symbol id="r-ore" viewBox="0 0 24 24">
        <path d="M2 20.5 L8 9 L11.5 12.5 L15.5 4 L22 20.5 Z" fill="#8c95a3" stroke="#3f4650" stroke-width="1.1" stroke-linejoin="round"/>
        <path d="M15.5 4 L13.4 8.6 L15.4 7.8 L17.4 9 Z" fill="#fff"/>
        <path d="M8 9 L6.6 11.7 L8.3 11 L9.7 11.9 Z" fill="#fff"/>
        <path d="M15.5 4 L17 20.5" stroke="#6b7480" stroke-width=".9"/>
      </symbol>
      <symbol id="r-desert" viewBox="0 0 24 24">
        <path d="M10.5 21V6.5a1.5 1.5 0 0 1 3 0V21" fill="#4f9a4a" stroke="#285626" stroke-width="1"/>
        <path d="M10.5 14H8a1.6 1.6 0 0 1-1.6-1.6V9.6a1.1 1.1 0 0 1 2.2 0v2.2h1.9M13.5 12h1.9V8.6a1.1 1.1 0 0 1 2.2 0v3.8a1.6 1.6 0 0 1-1.6 1.6h-2.5" fill="#4f9a4a" stroke="#285626" stroke-width="1"/>
        <path d="M3 21.5c3-2 6-2 9 0s6 2 9 0" stroke="#b9975a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
      </symbol>
      <symbol id="robber" viewBox="-1 -1 2 2">
        <ellipse cx="0" cy=".82" rx=".6" ry=".16" fill="rgba(0,0,0,.35)"/>
        <path d="M-.46 .8 C-.46 .15 -.32 -.08 0 -.12 C.32 -.08 .46 .15 .46 .8 Z" fill="#33303a" stroke="#0d0c10" stroke-width=".07"/>
        <circle cx="0" cy="-.42" r=".32" fill="#33303a" stroke="#0d0c10" stroke-width=".07"/>
        <path d="M-.2 -.47 h.4" stroke="#e8e0cc" stroke-width=".08" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-cards" viewBox="0 0 24 24">
        <rect x="3" y="4" width="12" height="16" rx="2" fill="#e9dcbc" stroke="currentColor" stroke-width="1.4" transform="rotate(-10 9 12)"/>
        <rect x="9" y="4" width="12" height="16" rx="2" fill="#fff7e6" stroke="currentColor" stroke-width="1.4" transform="rotate(8 15 12)"/>
      </symbol>
      <symbol id="i-dev" viewBox="0 0 24 24">
        <rect x="5" y="2.5" width="14" height="19" rx="2.2" fill="#3c2f6b" stroke="currentColor" stroke-width="1.4"/>
        <path d="M12 7l1.4 2.9 3.1.4-2.3 2.2.6 3.1-2.8-1.5-2.8 1.5.6-3.1-2.3-2.2 3.1-.4z" fill="#f4c04a"/>
      </symbol>
      <symbol id="i-knight" viewBox="0 0 24 24">
        <path d="M12 2.5l7.5 3v6c0 4.6-3.2 8.3-7.5 10-4.3-1.7-7.5-5.4-7.5-10v-6z" fill="#8f3a3a" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
        <path d="M12 6v11M8.5 10h7" stroke="#f4d9a0" stroke-width="1.8" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-road" viewBox="0 0 24 24">
        <path d="M8 22L10.5 2h3L16 22z" fill="#6b5a46" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/>
        <path d="M12 5v2.5M12 10.5v3M12 16.5v3.5" stroke="#f4d06a" stroke-width="1.4" stroke-linecap="round"/>
      </symbol>
      <symbol id="i-star" viewBox="0 0 24 24">
        <path d="M12 2.2l2.9 6 6.6.8-4.9 4.6 1.3 6.5L12 16.9l-5.9 3.2 1.3-6.5L2.5 9l6.6-.8z" fill="#f4c04a" stroke="#8c5f0a" stroke-width="1.2" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-house" viewBox="0 0 24 24">
        <path d="M4 20V10.5L12 4l8 6.5V20z" fill="currentColor" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-city" viewBox="0 0 24 24">
        <path d="M2 21V12h7V8l5-4.5L19 8v13z" fill="currentColor" stroke="#111" stroke-width="1.4" stroke-linejoin="round"/>
      </symbol>
      <symbol id="i-plenty" viewBox="0 0 24 24">
        <path d="M4 7c4 0 6 3 8 3s4-3 8-3l-2 12H6z" fill="#3f8f6a" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/>
        <circle cx="9" cy="6" r="2.4" fill="#f0bf35" stroke="#8a6512" stroke-width=".8"/><circle cx="15" cy="6" r="2.4" fill="#e07a47" stroke="#6e2d14" stroke-width=".8"/>
      </symbol>
      <symbol id="i-monopoly" viewBox="0 0 24 24">
        <path d="M3 18l1.5-10 4.5 4 3-7 3 7 4.5-4L21 18z" fill="#f4c04a" stroke="#8c5f0a" stroke-width="1.3" stroke-linejoin="round"/>
        <rect x="3" y="18" width="18" height="3" rx="1" fill="#d9a12b" stroke="#8c5f0a" stroke-width="1.1"/>
      </symbol>
    </defs>
  </svg>

  <div id="app">
    <!-- PORTADA -->
    <section id="home" class="screen">
      <div class="home-inner">
        <div class="logo">
          <svg viewBox="0 0 120 104" class="logo-mark" aria-hidden="true">
            <g stroke="#0c2233" stroke-width="3" stroke-linejoin="round">
              <polygon points="60,4 82,17 82,43 60,56 38,43 38,17" fill="#3d9a47"/>
              <polygon points="38,43 60,56 60,82 38,95 16,82 16,56" fill="#e3b33c"/>
              <polygon points="82,43 104,56 104,82 82,95 60,82 60,56" fill="#d66a3c"/>
            </g>
            <circle cx="60" cy="56" r="9" fill="#f6ecd2" stroke="#0c2233" stroke-width="3"/>
          </svg>
          <h1>Hexaterra</h1>
          <p class="tagline">Coloniza la isla, comercia y construye</p>
        </div>
        <div id="resumeBox" class="card-box hidden"></div>
        <div class="card-box">
          <label class="field"><span>Tu nombre</span>
            <input id="nameInput" maxlength="16" autocomplete="nickname" placeholder="Por ejemplo, Lucía">
          </label>
          <div id="joinCodeRow" class="field">
            <span>Código de sala</span>
            <input id="codeInput" maxlength="4" autocapitalize="characters" autocomplete="off" placeholder="ABCD">
          </div>
          <div class="btn-row">
            <button class="btn primary" data-do="join" id="joinBtn">Unirse</button>
            <button class="btn" data-do="create" id="createBtn">Crear partida</button>
          </div>
          <p id="homeError" class="error"></p>
        </div>
        <button class="link-btn" data-do="sheet" data-sheet="rules">Cómo se juega</button>
      </div>
    </section>

    <!-- SALA DE ESPERA -->
    <section id="lobby" class="screen">
      <div class="lobby-inner">
        <div class="lobby-head">
          <div>
            <div class="muted small">Código de sala</div>
            <div id="lobbyCode" class="room-code">····</div>
          </div>
          <button class="btn small" data-do="share">Compartir enlace</button>
        </div>
        <div class="qr-wrap"><div id="qr"></div><p class="muted small">Tus amigos pueden escanear este código<br>o entrar con el código de sala.</p></div>
        <h3>Jugadores <span id="lobbyCount" class="muted"></span></h3>
        <ul id="lobbyPlayers" class="lobby-players"></ul>
        <h3>Tu color</h3>
        <div id="colorPick" class="color-pick"></div>
        <h3>Reglas de la partida</h3>
        <div id="lobbySettings" class="settings"></div>
        <div class="btn-row">
          <button class="btn" data-do="leaveLobby">Salir</button>
          <button class="btn primary" id="startBtn" data-do="start">Empezar partida</button>
        </div>
        <p id="lobbyHint" class="muted small center"></p>
      </div>
    </section>

    <!-- PARTIDA -->
    <section id="game" class="screen">
      <header id="topbar">
        <div id="players" class="players"></div>
        <button class="icon-btn" data-do="sheet" data-sheet="menu" aria-label="Menú">☰</button>
      </header>
      <div id="boardWrap">
        <svg id="board" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="g-wood" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4f9f43"/><stop offset="1" stop-color="#2d6f2c"/></linearGradient>
            <linearGradient id="g-brick" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e08a5a"/><stop offset="1" stop-color="#b4552f"/></linearGradient>
            <linearGradient id="g-sheep" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b6dd7a"/><stop offset="1" stop-color="#7cb84b"/></linearGradient>
            <linearGradient id="g-wheat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f6d86e"/><stop offset="1" stop-color="#dcaa2a"/></linearGradient>
            <linearGradient id="g-ore" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b3bac3"/><stop offset="1" stop-color="#77808c"/></linearGradient>
            <linearGradient id="g-desert" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f1e1b2"/><stop offset="1" stop-color="#d7bc84"/></linearGradient>
            <radialGradient id="g-sea" cx=".5" cy=".5" r=".7"><stop offset="0" stop-color="#2f86c4"/><stop offset="1" stop-color="#1d5f95"/></radialGradient>
          </defs>
          <g id="world"></g>
        </svg>
        <div class="board-tools">
          <button class="tool-btn" data-do="sheet" data-sheet="log" aria-label="Historial">📜</button>
          <button class="tool-btn" data-do="sheet" data-sheet="rules" aria-label="Reglas">?</button>
          <button class="tool-btn" data-do="center" aria-label="Centrar tablero">⤢</button>
        </div>
        <div id="dice" class="dice"></div>
        <div id="netState" class="net-state hidden">Sin conexión…</div>
        <div id="tradeBanner" class="trade-banner hidden"></div>
        <div id="confirmBar" class="confirm-bar hidden"></div>
      </div>
      <div id="side">
        <div id="status" class="status"></div>
        <div id="hand" class="hand"></div>
        <nav id="actions" class="actions"></nav>
        <div id="logInline" class="log-inline"></div>
      </div>
    </section>
  </div>

  <div id="sheet" class="sheet hidden">
    <div class="sheet-backdrop" data-do="closeSheet"></div>
    <div class="sheet-panel" role="dialog">
      <div class="sheet-head"><h2 id="sheetTitle"></h2><button class="icon-btn" data-do="closeSheet" aria-label="Cerrar">✕</button></div>
      <div id="sheetBody" class="sheet-body"></div>
    </div>
  </div>
  <div id="overlay" class="overlay hidden"></div>
  <div id="toasts" class="toasts"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
  <script type="module" src="app.js"></script>
</body>
</html>
